[package]
name = "prio"
version = "0.3.2"
edition = "2024"
rust-version = "1.90"
description = "A small desktop app for keeping one ordered list of priorities: two global shortcuts, drag and drop, nothing else in the way"
license = "MIT"
repository = "https://github.com/BBellenoue/prio"
readme = "README.md"
keywords = ["todo", "priorities", "egui", "productivity"]
categories = ["gui"]
publish = false

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = "0.24.2"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
global-hotkey = "0.8"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
wgpu = { version = "27", default-features = false, features = ["metal"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11"] }
gtk = "0.18"
wgpu = { version = "27", default-features = false, features = ["vulkan"] }
x11-dl = "2.21"
