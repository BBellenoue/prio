name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Monday morning, so a new advisory on a dependency shows up without a commit

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned to a commit; the comment carries the tag Dependabot tracks.
jobs:
  semgrep:
    name: Semgrep (code, secrets, workflows)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Two rules are excluded on purpose:
      # - unsafe-usage: the resident talks to Win32 (RegisterHotKey, GetMessage, GetLocalTime)
      #   and to libc on macOS (localtime_r), every unsafe block is an FFI call with fixed
      #   arguments;
      # - args: std::env::args is only compared against the literal modes "add" / "list" / "cal".
      - name: Scan
        run: >
          semgrep scan --config p/rust --config p/secrets --config p/github-actions
          --exclude-rule rust.lang.security.unsafe-usage.unsafe-usage
          --exclude-rule rust.lang.security.args.args
          --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy (dependencies, secrets, misconfigurations)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true # sinon le SARIF (et le code de sortie) prend tout, MEDIUM compris
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  cargo-deny:
    name: cargo-deny (RustSec advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  gitleaks:
    name: Gitleaks (secrets in history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
