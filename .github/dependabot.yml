version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # wgpu is only listed to turn on the dx12 backend; its version must be the one
      # eframe pins, so it moves when eframe moves, never on its own.
      - dependency-name: wgpu
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
